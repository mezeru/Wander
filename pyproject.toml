[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wander"
version = "0.1.0"
description = "Travel planning MCP server and agent starter for the Wander multi-agent travel planner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp<2",
  "pydantic>=2.7",
  "langgraph",
  "langchain",
  "langchain-ollama",
  "langchain-mcp-adapters",
  "python-dotenv",
  "jsonschema",
]

[tool.setuptools]
packages = ["wander", "wander.graph", "wander.graph.nodes", "wander.data"]

[tool.setuptools.package-dir]
"" = "."
